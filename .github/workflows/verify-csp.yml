# Weekly CSP coverage check against production (read-only GETs/HEADs).
# Standalone on purpose — a CSP regression shouldn't be conflated with
# fetcher failures. GitHub's default workflow-failure email is the alert.
name: Verify CSP

on:
  schedule:
    - cron: "30 6 * * 1" # Mondays at 06:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read-only HTTP checks — no git creds needed in the workspace.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # CSP_VERIFY_TOKEN is optional. Without it the run still works from an
      # unchallenged IP, but GitHub-hosted runners score as bots and get
      # `cf-mitigated: challenge`. Set the secret and add a matching Cloudflare
      # WAF skip rule on `http.request.headers["x-csp-verifier"][0]` to let the
      # checker through — see the header comment in scripts/verify-csp.mjs.
      - name: Verify production CSP headers
        env:
          CSP_VERIFY_TOKEN: ${{ secrets.CSP_VERIFY_TOKEN }}
        run: node scripts/verify-csp.mjs https://gvns.ca

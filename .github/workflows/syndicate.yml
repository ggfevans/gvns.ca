# POSSE syndication workflow — cross-posts new posts to Bluesky, Mastodon, and Threads.
#
# Required repository secrets:
#   BLUESKY_HANDLE        — Bluesky handle (e.g. gvns.ca)
#   BLUESKY_APP_PASSWORD  — App Password from Bluesky settings
#   MASTODON_INSTANCE     — Mastodon instance URL (e.g. https://mastodon.social)
#   MASTODON_TOKEN        — Access token from Mastodon app settings
#   THREADS_USER_ID       — Threads user ID (from developer portal)
#   THREADS_ACCESS_TOKEN  — Long-lived Threads access token (refreshed by refresh-threads-token.yml)

name: Syndicate Posts

on:
  push:
    branches: [main]
    paths:
      - "src/content/posts/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Never let two runs post at once; queue, don't cancel (a cancelled run can
# be mid-way through posting).
concurrency:
  group: syndicate
  cancel-in-progress: false

jobs:
  syndicate:
    # Skip when this run was triggered by the syndicate workflow's own merge to
    # main (commit message comes from the PR title set by the composite action).
    # GITHUB_TOKEN merges don't fire push workflows, so this is a backstop in
    # case the merge token ever changes back to a PAT.
    # The `|| ''` fallback keeps workflow_dispatch runs working — head_commit
    # is undefined for that event.
    if: "${{ !startsWith(github.event.head_commit.message || '', 'chore: update syndication data') }}"
    runs-on: ubuntu-latest
    steps:
      # Already-posted state lives only in each post's `syndication`
      # frontmatter, and it reaches main via the auto-merged
      # auto/update-syndication-* PR. Until that PR merges (one Workers Build,
      # or indefinitely if the build fails), main still looks unsyndicated, so a
      # run now would post the same entries again. Fail loudly instead of
      # skipping: re-run once the pending PR has merged.
      - name: Refuse while a syndication PR is pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("auto/update-syndication-")) | "#\(.number)"] | join(" ")')
          if [ -n "$pending" ]; then
            echo "::error::Syndication PR still pending ($pending). Posting now would duplicate it; merge or close it, then re-run this workflow."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `commit-via-pr` runs `gh auth setup-git` before its own fetch/push,
          # so no token needs to sit in .git/config while `npm ci` runs
          # dependency install scripts.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Run syndication script
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: node scripts/syndicate.mjs

      - uses: ./.github/actions/commit-via-pr
        with:
          paths: src/content/posts/
          commit-message: "chore: update syndication data"
          branch-prefix: update-syndication
          github-token: ${{ github.token }}

name: 'Commit via PR'
description: >-
  Stage data changes on a temp branch, open a PR, and enable auto-merge once
  required status checks pass. Designed for scheduled "fetch-and-commit"
  workflows that target a protected `main` branch.

inputs:
  paths:
    description: >-
      Files or directories to stage, newline-separated. Optional — leave empty
      if a previous step has already committed the changes.
    required: false
    default: ''
  commit-message:
    description: 'Commit message (also used as the PR title).'
    required: true
  branch-prefix:
    description: >-
      Prefix for the temp branch name. The branch will be
      `auto/<prefix>-<run_id>` to guarantee uniqueness across concurrent runs.
    required: true
  pr-body:
    description: 'PR description.'
    required: false
    default: 'Automated update.'
  github-token:
    description: >-
      Token used for `git push`, `gh pr create`, and `gh pr merge`. Use
      `GITHUB_TOKEN`: PRs it opens are authored by github-actions[bot], which
      is not a ruleset bypass actor, so auto-merge waits for the required
      Workers Builds check. A PAT acts as the repo admin and would skip it.
    required: true

runs:
  using: 'composite'
  steps:
    # The ahead-check below merges whatever HEAD has over origin/main. Run
    # from a feature branch (e.g. `gh workflow run --ref <branch>`), that
    # would fast-forward the whole branch onto main, unreviewed.
    - name: Refuse to run outside main
      shell: bash
      run: |
        if [ "$GITHUB_REF" != "refs/heads/main" ]; then
          echo "::error::commit-via-pr only runs on refs/heads/main (got $GITHUB_REF); merging from here would land this branch's commits on main."
          exit 1
        fi

    - name: Configure git identity and auth
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        # Set up git to authenticate with the input token via gh's credential
        # helper. Lets callers pass `persist-credentials: false` to checkout so
        # the token isn't readable by intervening third-party action steps.
        gh auth setup-git

    - name: Stage and commit local changes
      shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        if [ -n "$INPUT_PATHS" ]; then
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            git add "$path"
          done <<< "$INPUT_PATHS"
        fi

        if ! git diff --staged --quiet; then
          git commit -m "$COMMIT_MESSAGE"
        fi

    - name: Check whether HEAD is ahead of origin/main
      id: ahead
      shell: bash
      run: |
        git fetch origin main --quiet
        AHEAD=$(git rev-list --count origin/main..HEAD)
        echo "count=$AHEAD" >> "$GITHUB_OUTPUT"
        if [ "$AHEAD" -eq 0 ]; then
          echo "No new commits relative to origin/main — nothing to push."
        else
          echo "$AHEAD commit(s) ahead of origin/main."
        fi

    - name: Push branch, open PR, enable auto-merge
      if: steps.ahead.outputs.count != '0'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BRANCH_PREFIX: ${{ inputs.branch-prefix }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        PR_BODY: ${{ inputs.pr-body }}
      run: |
        BRANCH="auto/${BRANCH_PREFIX}-${GITHUB_RUN_ID}"
        git checkout -b "$BRANCH"

        if ! git push origin "$BRANCH"; then
          echo "::error::Failed to push branch $BRANCH"
          exit 1
        fi

        if ! gh pr create \
          --base main \
          --head "$BRANCH" \
          --title "$COMMIT_MESSAGE" \
          --body "$PR_BODY"; then
          echo "::error::Failed to create PR for $BRANCH"
          exit 1
        fi

        # Auto-merge once the required Workers Builds check passes (ruleset on
        # main, see docs/CMS-SETUP.md). A data commit that breaks the build
        # stays an open PR instead of landing on main.
        gh pr merge "$BRANCH" --auto --squash --delete-branch

